plugins { id 'com.android.application' }
android {
    namespace 'com.manhmoc.edgebar'
    compileSdk 34
    signingConfigs { release { storeFile file("../edge.keystore"); storePassword "edge19"; keyAlias "edge19"; keyPassword "edge19" } }
    defaultConfig { applicationId "com.manhmoc.edgebar"; minSdk 26; targetSdk 34; versionCode 159; versionName "19.12.3.6.43" }
    buildTypes { debug { signingConfig signingConfigs.release }; release { signingConfig signingConfigs.release; minifyEnabled false } }
    lint {
        abortOnError false
        checkReleaseBuilds false
        // Bật các check dễ gây crash thực tế
        fatal 'NewApi', 'InlineApi', 'ResourceType',
              'MissingSuperCall', 'WrongConstant', 'WrongThread',
              'WrongThreadInterprocedural', 'Recycle',
              'StaticFieldLeak', 'ObsoleteSdkInt'
        htmlReport true
        xmlReport true
        textReport true
    }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += [
        '-Xlint:all,-deprecation,-unchecked',
        '-Xmaxerrs', '9999',
        '-Xmaxwarns', '9999'
    ]
}
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
